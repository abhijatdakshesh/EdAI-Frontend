name: Deploy Production — Web Frontend

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to confirm production release"
        required: true

jobs:
  gate-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Validate confirmation
        if: ${{ github.event.inputs.confirm != 'DEPLOY' }}
        run: |
          echo "Confirmation not provided. Aborting."
          exit 1

  build-and-deploy:
    needs: [gate-check]
    if: always() && (needs.gate-check.result == 'success' || github.event_name == 'push')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push to ACR
        run: |
          az acr login --name edaiacr
          docker build \
            -t edaiacr.azurecr.io/web:${{ github.sha }} \
            -t edaiacr.azurecr.io/web:latest \
            -f apps/web/Dockerfile \
            .
          docker push edaiacr.azurecr.io/web:${{ github.sha }}
          docker push edaiacr.azurecr.io/web:latest

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name edai-web \
            --resource-group edai-prod-rg \
            --image edaiacr.azurecr.io/web:${{ github.sha }}

      - name: Health check
        run: |
          sleep 20
          curl --fail "https://${{ secrets.PROD_DOMAIN }}" || (echo "Health check failed" && exit 1)
