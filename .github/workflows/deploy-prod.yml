name: Deploy Production — Web Frontend

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to confirm production release"
        required: true

jobs:
  gate-check:
    runs-on: ${{ vars.DEPLOY_RUNNER_LABEL || 'self-hosted' }}
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Validate confirmation
        if: ${{ github.event.inputs.confirm != 'DEPLOY' }}
        run: |
          echo "Confirmation not provided. Aborting."
          exit 1

  build-and-deploy:
    needs: [gate-check]
    if: needs.gate-check.result == 'success'
    runs-on: ${{ vars.DEPLOY_RUNNER_LABEL || 'self-hosted' }}
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push to ACR
        run: |
          az acr login --name edaiacrprod
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ secrets.NEXT_PUBLIC_API_BASE_URL }}" \
            --build-arg NEXT_PUBLIC_SOCKET_URL="${{ secrets.NEXT_PUBLIC_SOCKET_URL }}" \
            --build-arg NEXT_PUBLIC_USE_MOCKS=false \
            -t edaiacrprod.azurecr.io/web:${{ github.sha }} \
            -t edaiacrprod.azurecr.io/web:latest \
            -f apps/web/Dockerfile \
            .
          docker push edaiacrprod.azurecr.io/web:${{ github.sha }}
          docker push edaiacrprod.azurecr.io/web:latest

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name aca-web \
            --resource-group rg-edai-prod-cin \
            --image edaiacrprod.azurecr.io/web:${{ github.sha }}

      - name: Health check
        run: |
          DOMAIN="${{ secrets.PROD_DOMAIN }}"
          DOMAIN="${DOMAIN:-app.raycraft.in}"
          curl --retry 6 --retry-delay 10 --retry-connrefused --fail \
            "https://${DOMAIN}" || (echo "Health check failed" && exit 1)
