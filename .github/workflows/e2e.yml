name: E2E Tests

on:
  push:
    branches: [main, feat/**, fix/**]
  pull_request:
    branches: [main]

# ─── Reusable setup steps ────────────────────────────────────────────────────
# Shared env for all CI jobs — headless always true in CI
env:
  NEXT_PUBLIC_USE_MOCKS: "true"
  NEXTAUTH_URL: https://app.raycraft.in
  # Self-hosted runner shares port 3000 with local dev. Point Playwright at
  # the prod deploy so playwright.config.ts treats it as production and skips
  # the embedded webServer launch entirely.
  BASE_URL: https://app.raycraft.in
  CI: "true"

jobs:
  # ── P0: HARD BLOCK — release cannot proceed if any P0 fails ──────────────
  # Runner label is configurable: set repo variable E2E_RUNNER_LABEL to
  # 'ubuntu-latest' to flip back to GitHub-hosted once billing is restored.
  # Defaults to 'self-hosted' (zero-cost macOS arm64 runner).
  playwright-p0:
    name: "P0 — Release Gate (BLOCKS)"
    runs-on: ${{ vars.E2E_RUNNER_LABEL || 'self-hosted' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run P0 tests
        run: pnpm --filter @rv/web test:e2e:p0
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-test-secret-32-chars-minimum00' }}
      - name: Upload P0 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-p0-report
          path: |
            apps/web/playwright-report/
            apps/web/playwright-results.xml
          retention-days: 14

  # ── P1+P2: full suite must pass; only continues past P0 if P0 was green ──
  playwright-p1-p2-report:
    name: "P1+P2 — Full suite (must pass)"
    runs-on: ${{ vars.E2E_RUNNER_LABEL || 'self-hosted' }}
    timeout-minutes: 30
    needs: playwright-p0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run P1 tests
        run: pnpm --filter @rv/web test:e2e:p1
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-test-secret-32-chars-minimum00' }}
      - name: Run P2 tests
        run: pnpm --filter @rv/web test:e2e --project=chromium --grep "@P2"
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-test-secret-32-chars-minimum00' }}
      - name: Upload P1+P2 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-p1-p2-report
          path: apps/web/playwright-report/
          retention-days: 7
