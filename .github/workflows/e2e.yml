name: E2E Tests

on:
  push:
    branches: [main, feat/**, fix/**]
  pull_request:
    branches: [main]

# ─── Reusable setup steps ────────────────────────────────────────────────────
# Shared env for all CI jobs — headless always true in CI.
#
# BASE_URL is intentionally NOT set: with it unset, playwright.config.ts boots
# a local mocked Next.js server on :3000 and tests the branch code. Previously
# this pointed at the prod deploy (app.raycraft.in) which made e2e gate
# unrelated PRs whenever prod was slow.
env:
  NEXT_PUBLIC_USE_MOCKS: "true"
  NEXT_PUBLIC_USE_MOCK: "true"
  NEXTAUTH_URL: http://localhost:3000
  # Force the build to skip `output: "standalone"` so `next start` works.
  NEXT_DISABLE_STANDALONE: "1"
  CI: "true"

jobs:
  # ── P0: HARD BLOCK — release cannot proceed if any P0 fails ──────────────
  playwright-p0:
    name: "P0 — Release Gate (BLOCKS)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Build app (mocked, non-standalone)
        run: pnpm --filter @rv/web build
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-test-secret-32-chars-minimum00' }}
      - name: Run P0 tests
        run: pnpm --filter @rv/web test:e2e:p0
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-test-secret-32-chars-minimum00' }}
      - name: Upload P0 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-p0-report
          path: |
            apps/web/playwright-report/
            apps/web/playwright-results.xml
          retention-days: 14

  # ── P1+P2: full suite must pass; only continues past P0 if P0 was green ──
  playwright-p1-p2-report:
    name: "P1+P2 — Full suite (must pass)"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: playwright-p0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Build app (mocked, non-standalone)
        run: pnpm --filter @rv/web build
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-test-secret-32-chars-minimum00' }}
      - name: Run P1 tests
        run: pnpm --filter @rv/web test:e2e:p1
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-test-secret-32-chars-minimum00' }}
      - name: Run P2 tests
        run: pnpm --filter @rv/web test:e2e --project=chromium --grep "@P2"
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-test-secret-32-chars-minimum00' }}
      - name: Upload P1+P2 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-p1-p2-report
          path: apps/web/playwright-report/
          retention-days: 7
